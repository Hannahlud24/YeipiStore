<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YeipiStore</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  
  <svg class="iconos-svg" aria-hidden="true">
    <defs>
      <symbol id="whatsapp" viewBox="0 0 24 24">
        <path d="M20.8 11.6a8.8 8.8 0 0 1-13 7.7L3 21l1.7-4.7a8.8 8.8 0 1 1 16.1-4.7Z"/>
        <path d="M8 7.5c.3 4 4.5 8 8.5 8l.5-2-2.5-1-1 1a10 10 0 0 1-3.5-3.5l1-1-1-2.5Z"/>
      </symbol>

      <symbol id="instagram" viewBox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle
          cx="17.4"
          cy="6.7"
          r="0.7"
          fill="currentColor"
          stroke="none"
        />
      </symbol>

      <symbol id="tiktok" viewBox="0 0 24 24">
        <path d="M14 3v12.5A5 5 0 1 1 9 10.5"/>
        <path d="M14 3c0 4 3 6 6 6V6c-2 0-3-1-3-3Z"/>
      </symbol>

      <symbol id="compartir" viewBox="0 0 24 24">
        <path d="M12 15V3m-4 4 4-4 4 4"/>
        <path d="M6 11H4v10h16V11h-2"/>
      </symbol>
    </defs>
  </svg>

  <main class="pagina">
    <div class="barra">
      <span class="marca">YEIPI STORE</span>

      <button
        class="compartir"
        id="compartir-pagina"
        type="button"
        aria-label="Compartir página"
      >
        <svg><use href="#compartir"/></svg>
      </button>
    </div>

    <header>
      <div class="logo-grande">
        <img src="logo.jpeg" alt="Yeipi Store">
      </div>

      <h1></h1>

      <div class="redes">
  <a data-red="whatsapp" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24">
      <path d="M20.8 11.6a8.8 8.8 0 0 1-13 7.7L3 21l1.7-4.7a8.8 8.8 0 1 1 16.1-4.7Z"/>
      <path d="M8 7.5c.3 4 4.5 8 8.5 8l.5-2-2.5-1-1 1a10 10 0 0 1-3.5-3.5l1-1-1-2.5Z"/>
    </svg>
  </a>

  <a data-red="instagram" aria-label="Instagram">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle
        cx="17.5"
        cy="6.5"
        r="1"
        fill="currentColor"
        stroke="none"
      />
    </svg>
  </a>

  <a data-red="tiktok" aria-label="TikTok">
    <svg viewBox="0 0 24 24" class="tiktok-icono">
      <path d="M16.6 2H13v13.3a3 3 0 1 1-2.5-3V8.6a6.6 6.6 0 1 0 6.1 6.6V8.5a9 9 0 0 0 5.4 1.8V6.7A5.4 5.4 0 0 1 16.6 2Z"/>
    </svg>
  </a>
</div>
    </header>

    <div class="enlaces">
      <a class="boton" data-red="whatsapp">
  <span class="foto-red">
    <img src="logo.jpeg" alt="">

    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.8 11.6a8.8 8.8 0 0 1-13 7.7L3 21l1.7-4.7a8.8 8.8 0 1 1 16.1-4.7Z"/>
      <path d="M8 7.5c.3 4 4.5 8 8.5 8l.5-2-2.5-1-1 1a10 10 0 0 1-3.5-3.5l1-1-1-2.5Z"/>
    </svg>
  </span>

  <span class="nombre">WhatsApp</span>
  <span class="flecha" aria-hidden="true">↗</span>
</a>

      <a class="boton" data-red="instagram">
  <span class="foto-red">
    <img src="logo.jpeg" alt="">

    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle
        cx="17.5"
        cy="6.5"
        r="1"
        fill="currentColor"
        stroke="none"
      />
    </svg>
  </span>

  <span class="nombre">Instagram</span>
  <span class="flecha" aria-hidden="true">↗</span>
</a>

<a class="boton" data-red="tiktok">
  <span class="foto-red">
    <img src="logo.jpeg" alt="">

    <svg
      viewBox="0 0 24 24"
      class="simbolo-tiktok"
      aria-hidden="true"
    >
      <path d="M16.6 2H13v13.3a3 3 0 1 1-2.5-3V8.6a6.6 6.6 0 1 0 6.1 6.6V8.5a9 9 0 0 0 5.4 1.8V6.7A5.4 5.4 0 0 1 16.6 2Z"/>
    </svg>
  </span>

  <span class="nombre">TikTok</span>
  <span class="flecha" aria-hidden="true">↗</span>
</a>
    </div>
    <section class="video-catalogo">
  <h2>CONOCE NUESTRO CATALOGO!</h2>

  <video controls playsinline preload="metadata">
    <source src="video.mp4" type="video/mp4">
    Tu navegador no permite reproducir el video.
  </video>
</section>

    <p id="aviso" role="status"></p>

    <footer>
      Ropa deportiva · Menudeo y mayoreo<br>
      Yeipi Store
    </footer>
  </main>
</body>
</html>
